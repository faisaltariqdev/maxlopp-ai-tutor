[project]
name = "esma"
version = "0.1.0"
description = "Esma microservices platform"
readme = "README.md"
authors = [
    { name = "Abdullah Akram", email = "108747089+aharoo786@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16.1",
    "esma-common",
    "langchain>=1.4.7",
    "langchain-ollama>=1.1.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "packages/esma-common",
]

[tool.uv.sources]
esma-common = { workspace = true }
